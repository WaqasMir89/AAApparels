name: Capture original website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture public pages and assets
        run: |
          python3 scripts/inventory_source.py --timeout 20 --delay 0.2 || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('source-audit/manifest.json').read_text())
          assert len(manifest['pages']) >= 10, 'Expected original public pages were not captured'
          print(f"Captured {len(manifest['pages'])} pages and {len(manifest['assets'])} assets; {len(manifest['errors'])} errors require review.")
          PY
      - name: Capture licensed presentation fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          folder = Path('source-audit/fonts')
          folder.mkdir(exist_ok=True)
          for source, target in {
            'manrope/Manrope%5Bwght%5D.ttf': 'manrope.ttf',
            'manrope/OFL.txt': 'manrope-LICENSE.txt',
            'dmserifdisplay/DMSerifDisplay-Regular.ttf': 'dm-serif-display.ttf',
            'dmserifdisplay/OFL.txt': 'dm-serif-display-LICENSE.txt',
          }.items():
            urlretrieve('https://raw.githubusercontent.com/google/fonts/main/ofl/' + source, folder / target)
          PY
      - name: Save inventory for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-website-inventory
          path: |
            source-audit/
            source-audit-http/
          retention-days: 7
          if-no-files-found: error
