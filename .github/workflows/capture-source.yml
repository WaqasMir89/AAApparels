name: Capture original website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture public pages and assets
        run: |
          python3 scripts/inventory_source.py --timeout 20 --delay 0.2 || \
          python3 scripts/inventory_source.py --url http://www.aaapparels.com/ --output source-audit-http --timeout 20 --delay 0.2
      - name: Save inventory for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-website-inventory
          path: |
            source-audit/
            source-audit-http/
          retention-days: 7
          if-no-files-found: error
